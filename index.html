<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>みやそう病院 AR名刺</title>
    <!-- A-Frame 最新安定版 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR (A-Frame版) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // タップしてURLを開くコンポーネント
      AFRAME.registerComponent('link-handler', {
        init: function () {
          this.el.addEventListener('click', function () {
            const targetUrl = this.getAttribute('data-url');
            if (targetUrl) {
              window.open(targetUrl, '_blank');
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- mindar-image でアップロードした targets.mind を指定 -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- フキダシ付きの病院案内画像 -->
        <img id="hospital-img" src="./hospital.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

      <!-- targetIndex: 0 はロゴ画像に対応 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- ターゲットロゴの上に浮かせる病院画像（タップ可能） -->
        <!-- 縦長の画像に合わせて width, height を微調整 -->
        <a-image 
          id="building-btn"
          src="#hospital-img" 
          position="0 0.5 0.1" 
          rotation="0 0 0" 
          width="1.6" 
          height="1.0"
          data-url="https://www.miyasou-hp.jp/"
          link-handler
          class="clickable">
        </a-image>
      </a-entity>
    </a-scene>
  </body>
</html>
