<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Business Card</title>
    <!-- A-Frame と AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // タップで指定URLを開くスクリプト
      AFRAME.registerComponent('link-handler', {
        init: function () {
          this.el.addEventListener('click', function () {
            const targetUrl = this.getAttribute('data-url');
            if (targetUrl) {
              window.open(targetUrl, '_blank');
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- ARシーン定義 -->
    <a-scene embedded arjs vr-mode-ui="enabled: false">
      <a-assets>
        <!-- アップロードした病院画像 -->
        <img id="hospital-img" src="./hospital.png">
      </a-assets>

      <!-- パターンマーカー -->
      <a-marker type="pattern" url="./pattern-AR-QR.patt">

        <!-- 2. 病院画像（垂直に立てて、タップでHPへ遷移） -->
        <!-- 横幅16:9比率（width=2, height=1.12）で設定 -->
        <a-image 
          id="building-btn"
          src="#hospital-img" 
          position="0 0.5 0" 
          rotation="-30 0 0" 
          width="2" 
          height="1.3"
          data-url="https://www.miyasou-hp.jp/"
          link-handler
          class="clickable">
        </a-image>

      </a-marker>

      <!-- スマホの画面タップを検知するカメラ設定 -->
      <a-entity camera>
        <a-entity 
          cursor="rayOrigin: mouse" 
          raycaster="objects: .clickable">
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
